name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The suite is deliberately offline: no network, no game, no GPU.
      # If it needs any of those on CI, that is a bug in the test, not in CI.
      - name: Run the offline test suite
        run: python tests/test_all.py

      - name: Build the executable
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python build.py

      # A PyInstaller run can "succeed" and still produce nothing useful, so
      # the artifact is checked before it is published.
      - name: Verify the executable
        shell: pwsh
        run: |
          $exe = "dist/DLSS5Kit.exe"
          if (-not (Test-Path $exe)) { throw "dist/DLSS5Kit.exe was not produced" }
          $mb = (Get-Item $exe).Length / 1MB
          if ($mb -lt 5) { throw "DLSS5Kit.exe is only $mb MB - the build is incomplete" }
          Write-Host ("built {0:N1} MB" -f $mb)
          # --gpu needs no game folder and exercises detection plus the CLI.
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: DLSS5Kit
          path: dist/DLSS5Kit.exe

      - name: Attach the executable to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DLSS5Kit.exe
          generate_release_notes: true
